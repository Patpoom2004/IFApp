<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Mint Green) -->
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DB6A2"/>
      <stop offset="100%" stop-color="#2A7B6C"/>
    </linearGradient>
    
    <!-- Accent Flame Gradient (Coral Pink) -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF8F73"/>
      <stop offset="100%" stop-color="#FFB09C"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A4A41" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Background Square (Full 512x512 for iOS & Android Maskable) -->
  <rect width="512" height="512" fill="url(#mintBg)"/>

  <!-- 2. Main Icon Content (Centered inside Safe Zone) -->
  <g filter="url(#softShadow)" transform="translate(0, 0)">
    
    <!-- Outer Fasting Progress Ring (Arc) -->
    <circle cx="256" cy="256" r="140" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-opacity="0.25" 
            stroke-width="28" 
            stroke-linecap="round"/>
            
    <!-- Active Fasting Progress Arc (75% Complete) -->
    <path d="M 256 116 
             A 140 140 0 1 1 116 256" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Fat Burning Flame Symbol (Center) -->
    <path d="M 256 170 
             C 256 170 200 230 200 276 
             C 200 307 225 332 256 332 
             C 287 332 312 307 312 276 
             C 312 230 256 170 256 170 Z" 
          fill="url(#flameGrad)"/>

    <!-- Inner Core Flame (Highlight) -->
    <path d="M 256 225 
             C 256 225 228 260 228 285 
             C 228 300 240 312 256 312 
             C 272 312 284 300 284 285 
             C 284 260 256 225 256 225 Z" 
          fill="#FFFFFF" 
          fill-opacity="0.9"/>
          
    <!-- Small Timer Indicator Dot -->
    <circle cx="256" cy="116" r="14" fill="#FF8F73" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>
